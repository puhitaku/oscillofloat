AWSTemplateFormatVersion: "2010-09-09"
Description: oscillofloat TLS certificate for CloudFront (deploy in us-east-1)

Parameters:
  DomainName:
    Type: String
    Description: Domain the site is served on.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone that holds DomainName; the validation record is created there.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
